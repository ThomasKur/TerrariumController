name: Package Installer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  package-installer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare installer package
        run: |
          mkdir -p package
          cp -R PiSource/install package/
          cp README.md package/README.md
          chmod +x package/install/setup.sh

      - name: Create zip
        run: |
          cd package
          zip -r terrarium-controller.zip .
          mv terrarium-controller.zip ../

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: terrarium-controller
          path: terrarium-controller.zip
